name: Build expanded NeonVisuals 1.21.11

on:
  push:
    branches: [ neonvisuals-expanded-20261115 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack source archive
        run: |
          unzip -t neonvisuals-expanded-source.zip
          unzip -o neonvisuals-expanded-source.zip -d .
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile and build mod
        run: gradle build --no-daemon
      - name: Upload built mod
        uses: actions/upload-artifact@v4
        with:
          name: NeonVisuals-1.21.11-expanded
          path: build/libs/neonvisuals-1.1.0.jar
          if-no-files-found: error
